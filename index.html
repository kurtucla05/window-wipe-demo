<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1430">
<title>Squeegee · tonight's good deed</title>
<style>
  :root { --bg:#14122b; --ink:#f4f1ff; --muted:#a9a3c9; --accent:#ffcf5c; --accent2:#7fd8ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body { position:fixed; inset:0; }
  .screen { position:absolute; inset:0; display:none; }
  .screen.on { display:block; }
  /* ---------- Deed screen ---------- */
  #deed { padding:calc(env(safe-area-inset-top) + 36px) 22px calc(env(safe-area-inset-bottom) + 24px);
    background:radial-gradient(120% 70% at 50% 0%, #2c2763 0%, #14122b 65%); overflow-y:auto; }
  #deed .moon { font-size:44px; }
  #deed h1 { font-size:30px; margin:10px 0 6px; letter-spacing:-.5px; }
  #deed p.sub { color:var(--muted); margin:0 0 26px; font-size:16px; line-height:1.4; }
  .btn { display:block; width:100%; border:0; border-radius:16px; padding:17px 18px; font-size:17px; font-weight:650;
    font-family:inherit; color:#1b1630; background:var(--accent); margin:0 0 12px; cursor:pointer; }
  .btn.ghost { background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.14); }
  .btn.small { padding:11px 14px; font-size:15px; border-radius:12px; }
  .btn:disabled { opacity:.35; }
  .btn:active { transform:scale(.98); }
  .ideas { display:none; margin:6px 0 14px; }
  .idea { display:block; width:100%; text-align:left; padding:14px 16px; margin:0 0 10px; border-radius:14px;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.1); color:var(--ink); font-size:16px; font-family:inherit; line-height:1.3; }
  .idea.sel { border-color:var(--accent); background:rgba(255,207,92,.12); }
  .row { display:flex; gap:10px; }
  .own { display:none; margin:6px 0 14px; }
  .own input { width:100%; font-size:17px; padding:15px 16px; border-radius:14px; border:1.5px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06); color:var(--ink); font-family:inherit; outline:none; -webkit-user-select:text; user-select:text; }
  .own input:focus { border-color:var(--accent2); }
  #doneBtn { margin-top:18px; display:none; }
  /* ---------- Squeegee screen ---------- */
  #wipe { background:#0d1430; touch-action:none; }
  #wipe canvas.deco { pointer-events:none; }
  #safeProbe { position:absolute; top:0; height:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); visibility:hidden; }
  #wipe canvas { position:absolute; left:0; top:0; width:100%; height:100%; touch-action:none; }
  .hud { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 10px) 14px 0; display:flex;
    justify-content:space-between; align-items:center; pointer-events:none; z-index:5; }
  .pill { pointer-events:auto; background:rgba(15,12,35,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:8px 13px; font-size:14px; font-weight:600; font-family:inherit; }
  .hint { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 28px); text-align:center; z-index:5;
    pointer-events:none; color:#fff; font-weight:650; font-size:17px; text-shadow:0 1px 8px rgba(0,0,0,.6); transition:opacity .5s; }
  .finish { position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 22px); z-index:6; padding:20px;
    border-radius:22px; background:rgba(15,12,35,.62); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.16); text-align:center; opacity:0; transform:translateY(20px); transition:all .6s cubic-bezier(.2,.9,.3,1.2); pointer-events:none; }
  .finish.on { opacity:1; transform:none; pointer-events:auto; }
  .finish h2 { margin:0 0 4px; font-size:24px; }
  .finish p { margin:0 0 16px; color:#d6d1f0; font-size:15px; line-height:1.35; }
  #file { display:none; }
  /* ---------- Cabin screen ---------- */
  #cabin { background:#070b22; touch-action:none; }
  #cabin canvas { position:absolute; left:0; top:0; width:100%; height:100%; touch-action:none; }
  .cabMsg { position:absolute; left:20px; right:20px; top:calc(env(safe-area-inset-top) + 64px); text-align:center; z-index:5; pointer-events:none;
    font-size:21px; font-weight:750; color:#fff4dc; text-shadow:0 2px 14px rgba(0,0,0,.7), 0 0 24px rgba(255,170,80,.35); opacity:0; transform:translateY(-6px); transition:all .7s ease; }
  .cabMsg.on { opacity:1; transform:none; }
  .cabMsg small { display:block; font-size:14px; font-weight:550; color:#d9d3f2; margin-top:4px; }
  .cabBottom { position:absolute; left:18px; right:18px; bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:5; transition:opacity .4s; }
  .cabBottom.off { opacity:0; pointer-events:none; }
  .links { text-align:center; color:#a9b4d8; font-size:14px; margin-top:2px; }
  .links a { color:#c9d3f5; text-decoration:underline; text-underline-offset:3px; padding:6px 4px; cursor:pointer; }
  .winCard { position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:6; padding:18px 18px 8px; border-radius:22px;
    background:rgba(28,16,10,.62); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid rgba(255,200,140,.25);
    text-align:center; opacity:0; transform:translateY(20px); transition:all .5s cubic-bezier(.2,.9,.3,1.2); pointer-events:none; }
  .winCard.on { opacity:1; transform:none; pointer-events:auto; }
  .wdate { color:#ffcf8a; font-size:13px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; }
  .wdeed { font-size:19px; font-weight:650; margin:6px 0 14px; line-height:1.3; }
  .toast { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); z-index:7; background:rgba(10,12,30,.75); color:#fff; padding:10px 16px;
    border-radius:14px; font-size:15px; opacity:0; transition:opacity .3s; pointer-events:none; text-align:center; max-width:80%; }
  .toast.on { opacity:1; }
</style>
</head>
<body>

<!-- ============ SCREEN 1: tonight's good deed ============ -->
<section id="deed" class="screen on">
  <div class="moon">🌙</div>
  <h1>Tonight's good deed</h1>
  <p class="sub">One small kind thing, right from your phone. Then you earn the squeegee.</p>

  <button class="btn" id="suggestBtn">Need a suggestion?</button>
  <div class="ideas" id="ideas">
    <div id="ideaList"></div>
    <button class="btn ghost small" id="shuffleBtn">🔀 Shuffle</button>
  </div>

  <button class="btn ghost" id="ownBtn">I've got my own</button>
  <div class="own" id="own"><input id="ownInput" maxlength="80" placeholder="What did you do?" enterkeyhint="done" autocomplete="off"></div>

  <button class="btn" id="doneBtn" disabled>Done, earn your squeegee ✨</button>
  <button class="btn ghost small" id="cabinBtn" style="margin-top:22px">🏔️ My cabin</button>
</section>

<!-- ============ SCREEN 3: my cabin ============ -->
<section id="cabin" class="screen">
  <canvas id="cabinC"></canvas>
  <div class="hud">
    <button class="pill" id="cabBack">‹ Tonight</button>
    <span class="pill" id="cabCount">0 of 7 lit</span>
    <span style="width:84px"></span>
  </div>
  <div class="cabMsg" id="cabMsg"></div>
  <div class="cabBottom" id="cabBottom">
    <button class="btn" id="cabDeed">Do another</button>
    <div class="links"><a id="demoFill">Demo: fill cabin</a><span> · </span><a id="demoReset">Reset</a></div>
  </div>
  <div class="winCard" id="winCard">
    <div class="wdate" id="wcDate"></div>
    <div class="wdeed" id="wcDeed"></div>
    <button class="btn ghost small" id="wcClose">Close</button>
  </div>
  <div class="toast" id="toast"></div>
</section>

<!-- ============ SCREEN 2: squeegee ============ -->
<section id="wipe" class="screen">
  <canvas id="bg" class="deco"></canvas>
  <canvas id="photo" class="deco"></canvas>
  <canvas id="heavy" class="deco"></canvas>
  <canvas id="dirt" class="deco"></canvas>
  <canvas id="frame" class="deco"></canvas>
  <canvas id="fx"></canvas>
  <div id="safeProbe"></div>
  <div class="hud">
    <button class="pill" id="pickBtn">📷 My photo</button>
    <span class="pill" id="pct">0% clean</span>
    <button class="pill" id="soundBtn">🔇</button>
  </div>
  <div class="hint" id="hint">Drag to squeegee the frosty window</div>
  <div class="finish" id="finish">
    <h2>Clean. Nice work tonight.</h2>
    <p id="deedEcho"></p>
    <button class="btn" id="seeCabinBtn">See my cabin ›</button>
  </div>
  <input type="file" id="file" accept="image/*">
</section>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- deed screen
const IDEAS = [
  "Text someone “thinking of you” 💛", "Thank a coworker for something specific", "Leave a 5-star review for a local spot you love",
  "Send a voice note to a grandparent or parent", "Tell a friend one thing you admire about them", "Donate $1 to a cause you care about",
  "Reply to that message you've been putting off, kindly", "Send an old photo to the friend who's in it", "Compliment someone's work online",
  "Text your mom or dad “thank you for…”", "Check in on a friend who's had a hard week", "Recommend a small creator to someone",
  "Write a kind note for someone to find tomorrow", "Forgive someone in a short message", "Send a funny meme to cheer someone up",
  "Thank a teacher or mentor from years ago", "Tip a creator or busker you enjoy", "Say congrats to someone's recent win",
  "Ask someone how they're really doing", "Share a job post with someone looking", "Text a neighbor a quick hello",
  "Tell your partner one thing they did right today", "Leave an encouraging comment for a stranger", "Sign up to give blood (just book it)"
];
const $ = id => document.getElementById(id);
let chosenDeed = "";
function pick3() {
  const pool = IDEAS.slice(); const out = [];
  while (out.length < 3) out.push(pool.splice(Math.random() * pool.length | 0, 1)[0]);
  const list = $('ideaList'); list.innerHTML = '';
  out.forEach(t => { const b = document.createElement('button'); b.className = 'idea'; b.textContent = t;
    b.onclick = () => { [...list.children].forEach(c => c.classList.remove('sel')); b.classList.add('sel'); chosenDeed = t; $('doneBtn').disabled = false; };
    list.appendChild(b); });
  chosenDeed = ""; $('doneBtn').disabled = true;
}
$('suggestBtn').onclick = () => { $('ideas').style.display = 'block'; $('own').style.display = 'none'; $('doneBtn').style.display = 'block'; pick3(); };
$('shuffleBtn').onclick = pick3;
$('ownBtn').onclick = () => { $('own').style.display = 'block'; $('ideas').style.display = 'none'; $('doneBtn').style.display = 'block';
  chosenDeed = $('ownInput').value.trim(); $('doneBtn').disabled = !chosenDeed; $('ownInput').focus(); };
$('ownInput').oninput = e => { chosenDeed = e.target.value.trim(); $('doneBtn').disabled = !chosenDeed; };
$('ownInput').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
$('doneBtn').onclick = () => { if (!chosenDeed) return; $('deedEcho').textContent = 'Tonight: ' + chosenDeed; show('wipe'); startRound(); };
$('seeCabinBtn').onclick = () => goCabin();
$('cabinBtn').onclick = () => { show('cabin'); enterCabin(-1); };
function resetDeed() { $('ideas').style.display = 'none'; $('own').style.display = 'none'; $('doneBtn').style.display = 'none'; $('ownInput').value = ''; chosenDeed = ''; $('doneBtn').disabled = true; }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); if (id === 'wipe') resize(); if (id === 'cabin') cabResize(); }

// ---------------------------------------------------------------- iOS: no scroll / zoom
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.target.closest && !e.target.closest('#deed')) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 320 && e.target.closest && e.target.closest('#wipe')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

// ---------------------------------------------------------------- canvases
const cPhoto = $('photo'), cDirt = $('dirt'), cFx = $('fx'), cBg = $('bg'), cFrame = $('frame');
const gPhoto = cPhoto.getContext('2d'), gDirt = cDirt.getContext('2d'), gFx = cFx.getContext('2d'), gBg = cBg.getContext('2d'), gFrame = cFrame.getContext('2d');
const G = { x: 0, y: 0, w: 0, h: 0 };   // the window glass
// two-pass frost: the "light" film (cDirt) clears in one pull; the "heavy" layer (thick frost, slush, haze, edge lines)
// loses HEAVY_K of its opacity per pull, so thick patches need a second pass. Each pull is drawn into strokeM
// (so overlapping within one pull doesn't compound) and committed when the finger lifts or the stroke reverses.
const cHeavy = $('heavy'), gHeavy = cHeavy.getContext('2d');
const heavyC = document.createElement('canvas'), gHC = heavyC.getContext('2d');
const strokeM = document.createElement('canvas'), gSM = strokeM.getContext('2d');
const HEAVY_K = .62;
let HDPR = 1, heavyDirty = false, strokeHasMask = false, strokeEdges = [], strokeTravel = 0;
const bgCache = document.createElement('canvas');
let flakes = [];
let W = 0, H = 0, DPR = 1, FXDPR = 1;
let photoImg = null;           // user image (HTMLImageElement / ImageBitmap) or null => default
let defaultIdx = 0;

function resize() {
  const nw = innerWidth, nh = innerHeight;
  if (nw === W && nh === H && cPhoto.width) return;
  W = nw; H = nh; DPR = Math.min(window.devicePixelRatio || 1, 3); FXDPR = Math.min(DPR, 2);
  for (const c of [cPhoto, cDirt, cFrame]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  for (const c of [cFx, cBg, bgCache]) { c.width = Math.round(W * FXDPR); c.height = Math.round(H * FXDPR); }
  HDPR = Math.min(DPR, 2);
  for (const c of [cHeavy, heavyC, strokeM]) { c.width = Math.round(W * HDPR); c.height = Math.round(H * HDPR); }
  gHC.setTransform(HDPR, 0, 0, HDPR, 0, 0); gSM.setTransform(HDPR, 0, 0, HDPR, 0, 0); strokeHasMask = false;
  gPhoto.setTransform(DPR, 0, 0, DPR, 0, 0); gDirt.setTransform(DPR, 0, 0, DPR, 0, 0); gFrame.setTransform(DPR, 0, 0, DPR, 0, 0);
  gFx.setTransform(FXDPR, 0, 0, FXDPR, 0, 0); gBg.setTransform(FXDPR, 0, 0, FXDPR, 0, 0);
  const cs = getComputedStyle($('safeProbe')); const st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
  const fw = 18;  // wood thickness
  G.x = 16 + fw; G.w = W - 2 * G.x; G.y = st + 58 + fw; G.h = Math.max(200, H - G.y - sb - 92 - fw);
  paintBgCache(); drawFrame();
  flakes = []; for (let i = 0; i < Math.round(W * H / 3500); i++) flakes.push(newFlake(true));
  if (round.active) { drawPhoto(); makeDirt(); }
}
addEventListener('resize', () => { if ($('wipe').classList.contains('on')) { W = 0; resize(); } });

// ---- default image, painted procedurally (no network) : golden-hour lake
function paintDefault(g, w, h, variant) {
  const sky = g.createLinearGradient(0, 0, 0, h * .62);
  if (variant % 2 === 0) { sky.addColorStop(0, '#2b3a8f'); sky.addColorStop(.45, '#c2589a'); sky.addColorStop(.8, '#ff9a5a'); sky.addColorStop(1, '#ffd27a'); }
  else { sky.addColorStop(0, '#0b1d4d'); sky.addColorStop(.5, '#1f6f8b'); sky.addColorStop(.85, '#8fe3c6'); sky.addColorStop(1, '#f6f3c2'); }
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  // sun
  const sx = w * .62, sy = h * .5, sr = Math.min(w, h) * .11;
  const glow = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 5);
  glow.addColorStop(0, 'rgba(255,240,200,.95)'); glow.addColorStop(.18, 'rgba(255,210,140,.55)'); glow.addColorStop(1, 'rgba(255,180,120,0)');
  g.fillStyle = glow; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff6dc'; g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
  // stars
  let s = 7 + variant * 13; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  g.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 90; i++) { const x = rnd() * w, y = rnd() * h * .3; g.globalAlpha = rnd() * .8; g.fillRect(x, y, 1.6, 1.6); } g.globalAlpha = 1;
  // mountains
  const ridge = (base, amp, col, seed) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w + 10; x += 6) { const y = base - amp * (.5 + .5 * Math.sin(x * .011 + seed)) * (.6 + .4 * Math.sin(x * .027 + seed * 2)) - amp * .25 * Math.sin(x * .07 + seed); g.lineTo(x, y); }
    g.lineTo(w, h); g.closePath(); g.fill(); };
  ridge(h * .56, h * .16, variant % 2 ? '#2d4f73' : '#6b4a8f', 1.3);
  ridge(h * .6, h * .1, variant % 2 ? '#1d3654' : '#45306b', 4.1);
  // lake + reflection
  const lake = g.createLinearGradient(0, h * .6, 0, h);
  lake.addColorStop(0, variant % 2 ? '#5fb6b0' : '#e48a7a'); lake.addColorStop(1, variant % 2 ? '#0b2238' : '#2a1d4a');
  g.fillStyle = lake; g.fillRect(0, h * .6, w, h * .4);
  g.fillStyle = 'rgba(255,240,200,.5)';
  for (let i = 0; i < 26; i++) { const y = h * .61 + i * i * .55 * (h / 800); const ww = sr * (2.2 - i * .06) * (0.6 + rnd() * .6); g.globalAlpha = .55 - i * .018; g.fillRect(sx - ww / 2 + (rnd() - .5) * 12, y, ww, 2.2); }
  g.globalAlpha = 1;
  // pines
  const pine = (x, base, ht) => { g.fillStyle = '#120d24'; g.beginPath(); g.moveTo(x, base - ht);
    for (let k = 0; k < 4; k++) { const yy = base - ht + ht * (k + 1) / 4; const ww = ht * .22 * (k + 1) / 2.2; g.lineTo(x + ww, yy); g.lineTo(x + ww * .35, yy); }
    g.lineTo(x + 3, base); g.lineTo(x - 3, base);
    for (let k = 3; k >= 0; k--) { const yy = base - ht + ht * (k + 1) / 4; const ww = ht * .22 * (k + 1) / 2.2; g.lineTo(x - ww * .35, yy); g.lineTo(x - ww, yy); }
    g.closePath(); g.fill(); };
  for (let i = 0; i < 9; i++) pine(w * .02 + i * w * .045, h * .63, h * (.12 + rnd() * .1));
  for (let i = 0; i < 4; i++) pine(w * .82 + i * w * .05, h * .63, h * (.1 + rnd() * .08));
  // cabin with warm window
  const cx = w * .3, cy = h * .61, cw = w * .13;
  g.fillStyle = '#1a1230'; g.fillRect(cx, cy - cw * .55, cw, cw * .55);
  g.beginPath(); g.moveTo(cx - cw * .1, cy - cw * .55); g.lineTo(cx + cw / 2, cy - cw * .95); g.lineTo(cx + cw * 1.1, cy - cw * .55); g.fill();
  g.fillStyle = '#ffc35c'; g.shadowColor = '#ffb347'; g.shadowBlur = 18; g.fillRect(cx + cw * .2, cy - cw * .4, cw * .22, cw * .18); g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,195,92,.35)'; g.fillRect(cx + cw * .2, cy + 4, cw * .22, cw * .5);
  // tiny heart in the sky
  g.font = `${Math.round(w * .07)}px -apple-system, sans-serif`; g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,.9)';
  g.fillText('♥', w * .5, h * .2);
}

function drawPhoto() {
  gPhoto.clearRect(0, 0, W, H); gPhoto.save(); gPhoto.beginPath(); gPhoto.rect(G.x, G.y, G.w, G.h); gPhoto.clip();
  if (photoImg) {
    const iw = photoImg.naturalWidth || photoImg.width, ih = photoImg.naturalHeight || photoImg.height;
    const sc = Math.max(G.w / iw, G.h / ih), dw = iw * sc, dh = ih * sc;
    gPhoto.imageSmoothingQuality = 'high';
    gPhoto.drawImage(photoImg, G.x + (G.w - dw) / 2, G.y + (G.h - dh) / 2, dw, dh);
  } else { gPhoto.translate(G.x, G.y); paintDefault(gPhoto, G.w, G.h, defaultIdx); }
  gPhoto.restore();
}

// ---- snowy mountain village backdrop (cached) + falling snow
function paintBgCache() {
  const g = bgCache.getContext('2d'); g.setTransform(FXDPR, 0, 0, FXDPR, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0a1030'); sky.addColorStop(.6, '#1b2a5a'); sky.addColorStop(1, '#3a4d7e');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  let s = 99; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) { g.globalAlpha = .3 + rnd() * .6; g.fillStyle = '#fff'; g.fillRect(rnd() * W, rnd() * H * .35, 1.3, 1.3); } g.globalAlpha = 1;
  const ridge = (base, amp, col, snow, seed) => { g.beginPath(); g.moveTo(0, H);
    const pts = []; for (let x = 0; x <= W + 8; x += 8) { const y = base - amp * Math.abs(Math.sin(x * .009 + seed)) * (.7 + .3 * Math.sin(x * .031 + seed)); pts.push([x, y]); g.lineTo(x, y); }
    g.lineTo(W, H); g.closePath(); g.fillStyle = col; g.fill();

  g.fillStyle = '#eef3ff'; g.beginPath(); g.moveTo(L - cw * .08, B + cw * .02);
  for (let k = 0; k <= 24; k++) { const x = L - cw * .08 + cw * 1.16 * k / 24; if (x > dx - cw * .01 && x < dx + dw + cw * .01) { g.lineTo(x, B + cw * .005); continue; } g.lineTo(x, B - cw * (.02 + .018 * Math.sin(k * 1.9))); }
  g.lineTo(L + cw * 1.08, B + cw * .02); g.closePath(); g.fill();
  // warm light spilling onto the snow below the ground-floor windows and door
  g.save();
  cabWins.forEach((w, i) => { if (!w.ground) return; const lit = litAmount(i, now); if (!lit) return; const gl = glowAmount(i, now);
    const y0 = B + cw * .01, y1 = B + cw * (.32 + .1 * gl), sp = w.w * .55;
    const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, `rgba(255,158,70,${(.34 + .2 * gl) * lit})`); gr.addColorStop(1, 'rgba(255,158,70,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(w.x, y0); g.lineTo(w.x + w.w, y0); g.lineTo(w.x + w.w + sp, y1); g.lineTo(w.x - sp, y1); g.closePath(); g.fill(); });
  g.restore();
  // chimney smoke
  if (now - lastSmoke > 140) { lastSmoke = now; smoke.push({ x: chx + cw * .05, y: peak + cw * .03, r: cw * .02, a: .5, vx: .004 + Math.random() * .006, ph: Math.random() * 6 }); }
  for (const p of smoke) { p.y -= .018 * 16; p.x += (p.vx + Math.sin(now * .001 + p.ph) * .003) * 16; p.r += .05; p.a -= .0035; }
  smoke = smoke.filter(p => p.a > 0);
  for (const p of smoke) { const gr2 = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); gr2.addColorStop(0, `rgba(205,212,232,${p.a * .55})`); gr2.addColorStop(1, 'rgba(205,212,232,0)');
    g.fillStyle = gr2; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
}
function burst(i, n) { const w = cabWins[i]; if (!w) return; for (let k = 0; k < n; k++) cabSparks.push({ x: w.x + w.w / 2 + (Math.random() - .5) * w.w * 2.2, y: w.y + w.h / 2 + (Math.random() - .5) * w.h * 2.2, size: 3 + Math.random() * 6, t: -Math.random() * 500, life: 700 + Math.random() * 600, rot: Math.random() * 3 }); }

let cabLast = performance.now();
function cabFrame(now) {
  requestAnimationFrame(cabFrame);
  if (!$('cabin').classList.contains('on')) return;
  const dt = Math.min(50, now - cabLast); cabLast = now; stepCam(now);
  const g = cg; g.setTransform(CDPR, 0, 0, CDPR, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.save(); g.translate(CW / 2, CH / 2); g.scale(cam.s, cam.s); g.translate(-cam.cx, -cam.cy);
  g.drawImage(cabCache, 0, 0, CW, CH);
  drawCabin(g, now);
  for (const s of cabSparks) { s.t += dt; const p = s.t / s.life; if (p < 0) continue; const a = Math.sin(Math.min(1, p) * Math.PI), sz = s.size * (.4 + a);
    g.save(); g.translate(s.x, s.y); g.rotate(s.rot + p); g.globalAlpha = a; g.fillStyle = '#fff3d6'; g.shadowColor = '#ffcf7a'; g.shadowBlur = 10;
    g.beginPath(); for (let k = 0; k < 8; k++) { const rr = k % 2 ? sz * .22 : sz, an = k * Math.PI / 4; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } g.closePath(); g.fill(); g.restore(); }
  cabSparks = cabSparks.filter(s => s.t < s.life);
  g.restore();
  // falling snow in screen space (in front of everything)
  g.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of cabFlakes) { f.y += f.vy * dt * (1 + f.r * .35); f.x += Math.sin(now * .0006 + f.ph) * .12 * f.r; if (f.y > CH + 5) { f.y = -5; f.x = Math.random() * CW; }
    g.beginPath(); g.arc(f.x, f.y, f.r, 0, 7); g.fill(); }
}
requestAnimationFrame(cabFrame);

})();
