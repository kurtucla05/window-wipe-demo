<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Squeegee · close the day warm</title>
<style>
  html, body { margin:0; height:100%; background:#05070c; overflow:hidden; font-family:Georgia,'Times New Roman',serif; color:#f6ead6;
    -webkit-user-select:none; user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent; }

  .ui.on { opacity:1; pointer-events:auto; }
  .pill { font:14px/1 Georgia,serif; color:#f6ead6; background:rgba(20,12,8,.55); border:1px solid rgba(246,234,214,.28); border-radius:999px; padding:9px 14px;

  #cta { left:50%; transform:translateX(-50%); bottom:calc(98px + env(safe-area-inset-bottom)); font:18px/1 Georgia,serif; color:#2a1608; background:linear-gradient(#ffdfa8,#f2b866);
    border:0; border-radius:999px; padding:15px 30px; box-shadow:0 6px 24px rgba(0,0,0,.5), 0 0 30px rgba(255,180,90,.35); cursor:pointer; white-space:nowrap; }
  #alt2 { left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom)); font:13px/1 Georgia,serif; color:#f6ead6; background:none; border:0; text-decoration:underline; cursor:pointer; white-space:nowrap; }
  #alt2.on { opacity:.75; }
  #note { left:10px; right:10px; top:calc(10px + env(safe-area-inset-top)); padding:12px 14px; border-radius:18px; background:rgba(244,244,247,.94); color:#111; font:14px/1.3 -apple-system,system-ui,sans-serif;

  #note.on { transform:none; }
  #note .a { font-size:12px; letter-spacing:.04em; opacity:.6; margin-bottom:3px; display:flex; justify-content:space-between; }
  #note .b { font-weight:600; font-size:15px; }
  #alt { left:50%; transform:translateX(-50%); bottom:calc(56px + env(safe-area-inset-bottom)); font:13px/1 Georgia,serif; color:#f6ead6; background:none; border:0; text-decoration:underline; cursor:pointer; white-space:nowrap; }
  #alt.on { opacity:.75; }
  #deed, #who { left:16px; right:16px; top:calc(62px + env(safe-area-inset-top)); padding:20px 16px 16px; border-radius:22px; background:rgba(16,10,7,.74); border:1px solid rgba(246,234,214,.22);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  #deed .q, #who .q { font-size:23px; line-height:1.2; }
  #deed .s, #who .s { font-size:14px; opacity:.8; margin:6px 0 14px; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px; }
  .chip { font:14px/1 Georgia,serif; color:#f6ead6; background:rgba(255,255,255,.07); border:1px solid rgba(246,234,214,.3); border-radius:999px; padding:10px 13px; cursor:pointer; }
  .chip.sel { background:#f2b866; color:#2a1608; border-color:#f2b866; }

    -webkit-user-select:text; user-select:text; outline:none; touch-action:manipulation; }
  #deedIn::placeholder, #whoIn::placeholder { color:rgba(246,234,214,.5); }
  #deedGo, #whoGo { margin-top:12px; width:100%; font:18px/1 Georgia,serif; color:#2a1608; background:linear-gradient(#ffdfa8,#f2b866); border:0; border-radius:999px; padding:15px 20px; cursor:pointer; transition:opacity .3s; }
  #deedGo:disabled, #whoGo:disabled { opacity:.35; }
  #hudA { left:14px; top:calc(14px + env(safe-area-inset-top)); cursor:pointer; }
  #hudA.low { top:calc(60px + env(safe-area-inset-top)); }
  #album { inset:0; background:rgba(12,8,6,.95); overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; box-sizing:border-box; padding:calc(18px + env(safe-area-inset-top)) 16px 50px; }
  #album h2 { font-size:24px; font-weight:normal; margin:6px 0 0; }

  .fc i { display:block; font-style:normal; font-size:11px; margin-top:2px; }

    -webkit-user-select:text; user-select:text; outline:none; margin-bottom:6px; }

    transform:rotate(-1.5deg) scale(.9); transition:transform .45s cubic-bezier(.2,1.4,.4,1); text-align:center; }
  #card.on .paper { transform:rotate(-1.5deg) scale(1); }

</style>

<body>
<div id="stage">
  <canvas id="ext"></canvas>
  <div id="pane"><canvas id="heavy"></canvas><canvas id="dirt"></canvas><canvas id="glow"></canvas></div>
  <canvas id="room"></canvas>
  <canvas id="fx"></canvas>
  <button id="hudL" class="ui pill">← Outside</button>
  <div id="hudC" class="ui pill"></div>
  <div id="msg" class="ui"></div>
  <div id="hint" class="ui"></div>
  <button id="cta" class="ui">Step inside</button>
  <button id="alt" class="ui"></button>
  <div id="deed" class="ui">
    <div class="q">What good did you do today?</div>
    <div class="s">One thing. It becomes a keepsake in the cabin.</div>
    <div id="chips"></div>
    <input id="deedIn" maxlength="70" placeholder="Or write your own…" autocomplete="off" enterkeyhint="done">

  </div>
  <button id="alt2" class="ui"></button>
  <div id="who" class="ui">
    <div class="q">Whose cabin is this?</div>
    <div class="s">Your first name. It goes up over the window.</div>

    <button id="whoGo" disabled>It’s mine</button>
  </div>
  <div id="note" class="ui"><div class="a"><span>SQUEEGEE</span><span>demo of the evening reminder</span></div><div class="b"></div></div>
  <button id="hudA" class="ui pill">Album</button>
  <div id="album" class="ui"><button id="albX" class="pill">Close</button><h2></h2><h3 id="fh"></h3><div id="fgrid"></div><h3 id="dh"></h3>
    <input id="dfind" placeholder="Search your good deeds" autocomplete="off"><div id="dlist"></div></div>
  <div id="card" class="ui"><div class="paper"><div class="when"></div><div class="what"></div><div class="x">Tap to close</div></div></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t*t*(3 - 2*t); };
const on = (el, v) => el.classList.toggle('on', !!v);

const stage = $('stage'), fx = $('fx'), g = fx.getContext('2d');
let W = 0, H = 0, DPR = 1, SW = 0, SH = 0;      // W,H device px · SW,SH css px

/* =========================== layered depth renderer =========================== */
const VS = `attribute vec2 a; varying vec2 vS; void main(){ vS=vec2(a.x*.5+.5,.5-a.y*.5); gl_Position=vec4(a,0.,1.); }`;
const FS = `precision mediump float;
varying vec2 vS;
uniform sampler2D uL0,uL1,uL2,uD;
uniform vec2 uC,uV,uPar;
uniform float uFocus,uAsp,uAmb,uT,uGrain,uTw;
uniform vec3 uLp[6];
uniform float uLi[6];
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 uv=uC+(vS-.5)*uV;
  vec2 s0=uv+uPar*(texture2D(uD,uv).r-uFocus); s0=clamp(uv+uPar*(texture2D(uD,s0).r-uFocus),.002,.998);
  vec2 s1=uv+uPar*(texture2D(uD,uv).g-uFocus); s1=clamp(uv+uPar*(texture2D(uD,s1).g-uFocus),.002,.998);
  vec2 s2=uv+uPar*(texture2D(uD,uv).b-uFocus); s2=clamp(uv+uPar*(texture2D(uD,s2).b-uFocus),.002,.998);
  vec4 c1=texture2D(uL1,s1), c2=texture2D(uL2,s2);
  vec3 c=mix(mix(texture2D(uL0,s0).rgb,c1.rgb,c1.a),c2.rgb,c2.a);
  vec2 su=mix(mix(s0,s1,step(.5,c1.a)),s2,step(.5,c2.a));
  float lum=dot(c,vec3(.3,.59,.11));
  float L=uAmb;
  for(int i=0;i<6;i++){ vec2 q=(su-uLp[i].xy)*vec2(uAsp,1.); L+=uLi[i]*exp(-dot(q,q)/(uLp[i].z*uLp[i].z)); }
  vec3 tint=mix(vec3(.46,.6,1.),vec3(1.,.97,.92),smoothstep(.1,.8,L));
  vec3 o=c*tint*min(L,1.12);
  o=max(o,c*smoothstep(.62,.95,lum)*.34);
  vec2 q=(su-uLp[1].xy)*vec2(uAsp,1.);
  float tw=uTw*exp(-dot(q,q)/(uLp[1].z*uLp[1].z*.7));
  float h=hash(floor(su*vec2(260.*uAsp,260.)));
  o+=c*smoothstep(.55,.85,lum)*tw*(.5+.5*sin(uT*(2.+h*3.)+h*40.))*.8;
  vec2 v=vS-.5; o*=1.-dot(v,v)*.5;
  o+=(hash(vS*vec2(917.,613.)+fract(uT))-.5)*uGrain;
  gl_FragColor=vec4(o,1.);
}`;
function makeScene(canvas, im, opts) {
  const img = im[0], gl = canvas.getContext('webgl', { antialias:false, alpha:false });
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(p); gl.useProgram(p);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(p, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  const tex = (unit, src) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); };
  tex(0, im[0]); tex(1, im[1]); tex(2, im[2]); tex(3, im[3]);
  const grab = (src, w) => { const c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * src.height / src.width); const x = c.getContext('2d'); x.drawImage(src, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height); return (u, v, ch) => d.data[(clamp(Math.round(v * c.height), 0, c.height - 1) * c.width + clamp(Math.round(u * c.width), 0, c.width - 1)) * 4 + ch] / 255; };
  const zRaw = grab(im[4], im[4].width), zLay = grab(im[3], 240);
  const U = {}; ['uL0','uL1','uL2','uD','uC','uV','uPar','uFocus','uAsp','uAmb','uT','uGrain','uTw','uLp','uLi'].forEach(n => U[n] = gl.getUniformLocation(p, n));
  gl.uniform1i(U.uL0, 0); gl.uniform1i(U.uL1, 1); gl.uniform1i(U.uL2, 2); gl.uniform1i(U.uD, 3);
  return Object.assign({ gl, U, canvas, z: (u, v) => zRaw(u, v, 0), zm: (u, v) => zLay(u, v, 1), pu:0, pv:0, asp: img.width / img.height, cx:.5, cy:.5, zoom:1, focus:.5, amt:.07, amb:1, grain:.02,
    lp: new Float32Array(18), li: new Float32Array(6), tw:0, uw:1, uh:1 }, opts);
}
function view(sc) { const sa = W / H; sc.uw = Math.min(1, sa / sc.asp) / sc.zoom / 1.06; sc.uh = Math.min(1, sc.asp / sa) / sc.zoom / 1.06; const m = .02;
  sc.cx = clamp(sc.cx, sc.uw/2 + m, 1 - sc.uw/2 - m); sc.cy = clamp(sc.cy, sc.uh/2 + m, 1 - sc.uh/2 - m); }
function draw(sc, px, py, t) { const { gl, U } = sc; view(sc); const mn = Math.min(W, H); gl.viewport(0, 0, W, H);
  gl.uniform2f(U.uC, sc.cx, sc.cy); gl.uniform2f(U.uV, sc.uw, sc.uh);
  sc.pu = px * sc.amt * sc.uw * mn / W; sc.pv = py * sc.amt * sc.uh * mn / H; gl.uniform2f(U.uPar, sc.pu, sc.pv);
  gl.uniform1f(U.uFocus, sc.focus); gl.uniform1f(U.uAsp, sc.asp); gl.uniform1f(U.uAmb, sc.amb); gl.uniform1f(U.uT, t); gl.uniform1f(U.uGrain, sc.grain); gl.uniform1f(U.uTw, sc.tw);
  gl.uniform3fv(U.uLp, sc.lp); gl.uniform1fv(U.uLi, sc.li); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
const scr = (sc, u, v, k) => [((u - sc.pu * k - sc.cx) / sc.uw + .5) * W, ((v - sc.pv * k - sc.cy) / sc.uh + .5) * H];
const toScreen = (sc, u, v) => scr(sc, u, v, sc.z(u, v) - sc.focus);
const toScreenMid = (sc, u, v) => scr(sc, u, v, sc.zm(u, v) - sc.focus);
const toUV = (sc, x, y) => [sc.cx + (x / W - .5) * sc.uw, sc.cy + (y / H - .5) * sc.uh];

/* =========================== state =========================== */
let ext, room, mode = 'boot', tMode = 0, roomA = 0, pushFrom = null, camAnim = null, roomAnim = null;
// boot | ask | out | walk | wipe | done | push | room | pull
const WR = { u0:.240, v0:.444, u1:.665, v1:.668 }, WIN = [(WR.u0 + WR.u1) / 2, (WR.v0 + WR.v1) / 2];   // the cabin's picture window, in image space
const LIGHTS = [
  { n:'the fire',        x:.305, y:.525, r:.42, I:1.0 },
  { n:'the tree',        x:.905, y:.50,  r:.36, I:.9 },
  { n:'the cocoa table', x:.84,  y:.79,  r:.40, I:.9 },
  { n:'the lanterns',    x:.557, y:.575, r:.30, I:.85 },
  { n:'the window seat', x:.19,  y:.60,  r:.30, I:.8 },
  { n:'the kitchen',     x:.70,  y:.40,  r:.36, I:.85 },
];
const NL = LIGHTS.length, FIRE = [.305, .545], MUGS = [[.83,.655],[.72,.71],[.82,.825],[.92,.805]];
const STORE = 'squeegee.v6', MAXN = 12;
// everything personal lives here: the name, a private seed that decides how this cabin fills up, the deeds, and when you were last here
const S = (() => { try { const o = JSON.parse(localStorage.getItem(STORE)); if (o && Array.isArray(o.deeds) && o.seed) return o; } catch (e) {} return null; })() || { name:'', seed:(Math.random() * 4294967296) >>> 0, deeds:[], last:0, off:0 };
S.frost = S.frost || [];                                                  // every frost you chose to keep
let deeds = S.deeds, nights = deeds.length, pendingDeed = '';
const saveNights = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
const DAY = 864e5, clock = () => Date.now() + (S.off || 0) * DAY;      // S.off = days skipped with the demo links
// one keepsake per night, each sitting near that night's light.  u,v = where it hangs from (or stands on) · s = height as a share of the picture
const KEEPS = [
  { k:'tag',    u:.31,   v:.395, s:.075, say:'a note on the mantel' },
  { k:'candle', u:.546,  v:.602, s:.05,  say:'a candle by the lanterns' },
  { k:'orn0',   u:.875,  v:.47,  s:.06,  say:'an ornament on the tree' },
  { k:'candle', u:.612,  v:.848, s:.085, say:'a candle on the cocoa table' },
  { k:'tag',    u:.795,  v:.52,  s:.06,  say:'a note in the kitchen' },
  { k:'candle', u:.216,  v:.632, s:.06,  say:'a candle by the window seat' },
  { k:'orn1',   u:.93,   v:.38,  s:.055, say:'an ornament on the tree' },
  { k:'tag',    u:.545,  v:.387, s:.055, say:'a note on the bookshelf' },
  { k:'orn2',   u:.865,  v:.60,  s:.06,  say:'an ornament low on the tree' },
  { k:'tag',    u:.345,  v:.395, s:.065, say:'a note on the mantel' },
  { k:'orn0',   u:.955,  v:.55,  s:.06,  say:'an ornament on the tree' },
  { k:'candle', u:.365,  v:.372, s:.045, say:'a candle on the mantel' },
];
const keepT = new Array(MAXN).fill(0), keepSw = new Array(MAXN).fill(0);
let keepNew = -1, keepFresh = -1;
const KL = [0, 3, 1, 2, 5, 4, 1, 3, 1, 0, 1, 0];                         // which light each keepsake spot sits beside
let ORDER, SLOT, SUR, TUNE;                                               // this cabin's own plan, all drawn from its seed
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = r() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makePlan() { const r = mulberry(S.seed);
  ORDER = [0, ...shuffle([1, 2, 3, 4, 5], r)];                             // the fire is always first; the other lights come in this cabin's own order
  const left = KEEPS.map((_, i) => i); SLOT = [];
  for (const L of ORDER) { const c = left.filter(i => KL[i] === L), p = c[r() * c.length | 0]; SLOT.push(p); left.splice(left.indexOf(p), 1); }
  SLOT.push(...shuffle(left, r));
  const cols = shuffle(['orn0', 'orn1', 'orn2', 'orn1'], r); let ci = 0; KEEPS.forEach(K => { if (K.k.slice(0, 3) === 'orn') K.k = cols[ci++]; });
  SUR = new Array(MAXN).fill(null); let n = 1 + (r() * 2 | 0), bag = [];   // surprise nights: which ones and what kind differ per cabin
  while (n < MAXN) { if (!bag.length) bag = shuffle(['letter', 'gift', 'glow'], r); SUR[n] = bag.pop(); n += 2 + (r() * 2 | 0); }
  const sc = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5]; let p = 2 + (r() * 4 | 0); TUNE = [];   // and a little tune no other cabin has
  for (let i = 0; i < 9; i++) { TUNE.push([sc[p], r() < .3 ? .44 : .22]); p += [-3, -2, -1, -1, 1, 1, 2, 3][r() * 8 | 0]; if (p > 7) p = 14 - p; if (p < 0) p = -p; } TUNE[8] = [sc[[0, 2, 4, 5][r() * 4 | 0]], .8];
