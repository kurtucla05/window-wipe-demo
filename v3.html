<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f26">
<title>Squeegee · close the day warm</title>
<style>
  :root { --ink:#fff5e4; --muted:#c9b8a6; --accent:#ffc861; --accent2:#ff9a4a; --night:#0b0f26;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--night); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body { position:fixed; inset:0; }
  .screen { position:absolute; inset:0; display:none; }
  .screen.on { display:block; }
  #safeProbe { position:absolute; top:0; height:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); visibility:hidden; }

  /* ---------- deed ---------- */
  #deed { padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 24px); overflow-y:auto;
    background:radial-gradient(90% 46% at 50% 104%, rgba(255,150,60,.34) 0%, rgba(255,150,60,0) 70%),
               radial-gradient(120% 70% at 50% 0%, #26306b 0%, #0b0f26 68%); }
  #deed .inner { max-width:440px; margin:0 auto; }
  #deed .eyebrow { font-size:13px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); font-weight:700; }
  #deed h1 { font-family:var(--serif); font-weight:600; font-size:36px; line-height:1.08; margin:10px 0 10px; letter-spacing:-.4px; }
  #deed p.sub { color:var(--muted); margin:0 0 28px; font-size:16.5px; line-height:1.45; }
  .btn { display:block; width:100%; border:0; border-radius:16px; padding:17px 18px; font-size:17px; font-weight:650; font-family:inherit;
    color:#2a1606; background:linear-gradient(180deg,#ffd77e,#ffb84d); margin:0 0 12px; cursor:pointer; box-shadow:0 6px 22px rgba(255,160,60,.25); }
  .btn.ghost { background:rgba(255,255,255,.07); color:var(--ink); border:1px solid rgba(255,255,255,.14); box-shadow:none; }
  .btn.small { padding:12px 14px; font-size:15px; border-radius:13px; }
  .btn:disabled { opacity:.35; box-shadow:none; }
  .btn:active { transform:scale(.98); }
  .ideas, .own { display:none; margin:4px 0 14px; }
  .idea { display:block; width:100%; text-align:left; padding:14px 16px; margin:0 0 10px; border-radius:14px; background:rgba(255,255,255,.06);
    border:1.5px solid rgba(255,255,255,.1); color:var(--ink); font-size:16px; font-family:inherit; line-height:1.3; }
  .idea.sel { border-color:var(--accent); background:rgba(255,200,97,.13); }
  .own input { width:100%; font-size:17px; padding:15px 16px; border-radius:14px; border:1.5px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06); color:var(--ink); font-family:inherit; outline:none; -webkit-user-select:text; user-select:text; }
  .own input:focus { border-color:var(--accent); }
  #doneBtn { margin-top:18px; display:none; }

  /* ---------- world ---------- */
  #world { background:#0a0706; touch-action:none; }
  #world canvas { position:absolute; left:0; top:0; width:100%; height:100%; touch-action:none; }
  #pane { position:absolute; inset:0; pointer-events:none; transition:transform 1.5s cubic-bezier(.5,0,.25,1), opacity 1.05s ease .15s; will-change:transform,opacity; }
  #pane.gone { opacity:0; }
  #pane.snap { transition:none; }
  #glow { opacity:.42; filter:blur(9px) brightness(1.45) saturate(.9) sepia(.35); transition:opacity .9s ease; }
  #dirt, #heavy { transition:opacity .9s ease; }
  #fx { transition:opacity .6s ease; }
  #fx.off { opacity:0; pointer-events:none; }
  #cabinC { transition:opacity .45s ease; }
  #cabinC.off { opacity:0; pointer-events:none; }
  .hud { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 12px) 14px 0; display:flex; justify-content:space-between;
    align-items:center; gap:8px; pointer-events:none; z-index:8; }
  .pill { pointer-events:auto; background:rgba(22,12,8,.58); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:#fff;
    border:1px solid rgba(255,220,180,.2); border-radius:999px; padding:9px 14px; font-size:14px; font-weight:600; font-family:inherit; white-space:nowrap; cursor:pointer; }
  .pill.quiet { pointer-events:none; }
  .pill:empty { visibility:hidden; }
  .ui { position:absolute; z-index:7; transition:opacity .5s ease, transform .6s cubic-bezier(.2,.9,.3,1.15); }
  .ui.off { opacity:0; pointer-events:none; }
  .hint { left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 34px); text-align:center; pointer-events:none; color:#fff; font-weight:650;
    font-size:17px; text-shadow:0 1px 10px rgba(0,0,0,.8); }
  .hint.high { bottom:calc(env(safe-area-inset-bottom) + 72px); }
  .card { left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 20px); max-width:460px; margin:0 auto; padding:20px 20px 10px; border-radius:24px;
    background:rgba(30,16,9,.66); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid rgba(255,205,150,.24); text-align:center; }
  .card.off { transform:translateY(22px); }
  .card h2 { font-family:var(--serif); margin:0 0 4px; font-size:26px; font-weight:600; }
  .card p { margin:0 0 16px; color:#ead9c6; font-size:15.5px; line-height:1.35; }
  .card .when { color:#ffcf8a; font-size:12.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
  .card .what { font-family:var(--serif); font-size:21px; margin:6px 0 16px; line-height:1.3; }
  .msg { left:22px; right:22px; top:calc(env(safe-area-inset-top) + 74px); text-align:center; pointer-events:none; font-family:var(--serif); font-size:25px;
    font-weight:600; color:#fff4dc; text-shadow:0 2px 14px rgba(0,0,0,.75), 0 0 26px rgba(255,170,80,.35); }
  .msg.off { transform:translateY(-8px); }
  .msg small { display:block; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14.5px; font-weight:550; color:#dcd5ee; margin-top:6px; line-height:1.35; }
  .bottom { left:18px; right:18px; bottom:calc(env(safe-area-inset-bottom) + 14px); max-width:460px; margin:0 auto; }
  .links { text-align:center; color:#b5a999; font-size:13.5px; margin-top:2px; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  .links a { color:#e6d8c6; text-decoration:underline; text-underline-offset:3px; padding:6px 4px; cursor:pointer; }
  #roomBottom { text-align:center; }
  #scrub { width:74px; height:5px; border-radius:3px; background:rgba(255,255,255,.2); margin:0 auto 8px; position:relative; overflow:hidden; }
  #scrub i { position:absolute; top:0; bottom:0; border-radius:3px; background:rgba(255,222,170,.95); }
  .toast { left:50%; top:46%; transform:translate(-50%,-50%); z-index:9; background:rgba(20,10,6,.8); color:#fff; padding:11px 16px; border-radius:14px;
    font-size:15px; pointer-events:none; text-align:center; max-width:82%; }
  .toast.off { transform:translate(-50%,-50%); }
  #file { display:none; }
</style>
</head>
<body>
<div id="safeProbe"></div>

<!-- ============ tonight's good deed ============ -->
<section id="deed" class="screen on">
  <div class="inner">
    <div class="eyebrow">Tonight</div>
    <h1>One good thing for someone else.</h1>
    <p class="sub">Do it, then come in from the cold. There's a window to clear and a warm room behind it.</p>

    <button class="btn" id="suggestBtn">Need a suggestion?</button>
    <div class="ideas" id="ideas">
      <div id="ideaList"></div>
      <button class="btn ghost small" id="shuffleBtn">Shuffle</button>
    </div>

    <button class="btn ghost" id="ownBtn">I've got my own</button>
    <div class="own" id="own"><input id="ownInput" maxlength="80" placeholder="What did you do?" enterkeyhint="done" autocomplete="off"></div>

    <button class="btn" id="doneBtn" disabled>I did it</button>
    <button class="btn ghost small" id="visitBtn" style="margin-top:22px">Visit my cabin</button>
  </div>
</section>

<!-- ============ the cabin: outside, the window, and the room ============ -->
<section id="world" class="screen">
  <canvas id="roomV"></canvas>
  <div id="pane">
    <canvas id="heavy"></canvas>
    <canvas id="dirt"></canvas>
    <canvas id="glow"></canvas>
    <canvas id="frame"></canvas>
  </div>
  <canvas id="fx"></canvas>
  <canvas id="cabinC"></canvas>

  <div class="hud">
    <button class="pill" id="hudL"></button>
    <span class="pill quiet" id="hudC"></span>
    <button class="pill" id="soundBtn">🔊</button>
  </div>

  <div class="ui msg off" id="msg"></div>
  <div class="ui hint off" id="hint"></div>

  <div class="ui card off" id="finish">
    <h2>There it is.</h2>
    <p id="deedEcho"></p>
    <button class="btn" id="stepBtn">Step inside</button>
  </div>

  <div class="ui bottom off" id="cabBottom">
    <button class="btn" id="cabStep">Step inside</button>
    <button class="btn ghost small" id="cabDeed">Tonight's good deed</button>
    <div class="links"><a id="demoFillA">Demo: fill the room</a><span> · </span><a id="demoResetA">Reset</a></div>
  </div>

  <div class="ui bottom off" id="roomBottom">
    <div id="scrub"><i id="scrubI"></i></div>
    <div class="links"><a id="demoFillB">Demo: fill the room</a><span> · </span><a id="demoResetB">Reset</a></div>
  </div>

  <div class="ui card off" id="frameCard">
    <div class="when" id="fcWhen"></div>
    <div class="what" id="fcWhat"></div>
    <button class="btn ghost small" id="fcClose">Close</button>
  </div>

  <div class="ui toast off" id="toast"></div>
  <input type="file" id="file" accept="image/*">
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const on = (el, v) => el.classList.toggle('off', !v);

// =====================================================================================================
// deed screen
// =====================================================================================================
const IDEAS = [
  "Text someone “thinking of you”", "Thank a coworker for something specific", "Leave a 5-star review for a local spot you love",
  "Send a voice note to a grandparent or parent", "Tell a friend one thing you admire about them", "Donate $1 to a cause you care about",
  "Reply to that message you've been putting off, kindly", "Send an old photo to the friend who's in it", "Compliment someone's work online",
  "Text your mom or dad “thank you for…”", "Check in on a friend who's had a hard week", "Recommend a small creator to someone",
  "Write a kind note for someone to find tomorrow", "Forgive someone in a short message", "Send a funny meme to cheer someone up",
  "Thank a teacher or mentor from years ago", "Tip a creator or busker you enjoy", "Say congrats to someone's recent win",
  "Ask someone how they're really doing", "Share a job post with someone looking", "Text a neighbor a quick hello",
  "Tell your partner one thing they did right today", "Leave an encouraging comment for a stranger", "Sign up to give blood (just book it)"
];
let chosenDeed = "";
function pick3() {
  const pool = IDEAS.slice(), out = [];
  while (out.length < 3) out.push(pool.splice(Math.random() * pool.length | 0, 1)[0]);
  const list = $('ideaList'); list.innerHTML = '';
  out.forEach(t => { const b = document.createElement('button'); b.className = 'idea'; b.textContent = t;
    b.onclick = () => { [...list.children].forEach(c => c.classList.remove('sel')); b.classList.add('sel'); chosenDeed = t; $('doneBtn').disabled = false; };
    list.appendChild(b); });
  chosenDeed = ""; $('doneBtn').disabled = true;
}
$('suggestBtn').onclick = () => { $('ideas').style.display = 'block'; $('own').style.display = 'none'; $('doneBtn').style.display = 'block'; pick3(); };
$('shuffleBtn').onclick = pick3;
$('ownBtn').onclick = () => { $('own').style.display = 'block'; $('ideas').style.display = 'none'; $('doneBtn').style.display = 'block';
  chosenDeed = $('ownInput').value.trim(); $('doneBtn').disabled = !chosenDeed; $('ownInput').focus(); };
$('ownInput').oninput = e => { chosenDeed = e.target.value.trim(); $('doneBtn').disabled = !chosenDeed; };
$('ownInput').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
$('doneBtn').onclick = () => { if (!chosenDeed) return; unlockAudio(); arrive(); };
$('visitBtn').onclick = () => { unlockAudio(); visit(); };
function resetDeed() { $('ideas').style.display = 'none'; $('own').style.display = 'none'; $('doneBtn').style.display = 'none'; $('ownInput').value = ''; chosenDeed = ''; $('doneBtn').disabled = true; }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

// ---- iOS: no scroll / zoom
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.target.closest && !e.target.closest('#deed')) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 320 && e.target.closest && e.target.closest('canvas')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

// =====================================================================================================
// small helpers
// =====================================================================================================
const mkRnd = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function lin(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); return gr; }
function glowDot(g, x, y, r, rgb, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
function tile(base, bandA, bandB, line) { const c = document.createElement('canvas'); c.width = c.height = 48; const p = c.getContext('2d');
  p.fillStyle = base; p.fillRect(0, 0, 48, 48);
  p.fillStyle = bandA; p.globalAlpha = .55; p.fillRect(0, 8, 48, 14); p.fillRect(8, 0, 14, 48);
  p.fillStyle = bandB; p.globalAlpha = .5; p.fillRect(0, 32, 48, 6); p.fillRect(32, 0, 6, 48);
  p.globalAlpha = .85; p.fillStyle = line; p.fillRect(0, 14, 48, 1.5); p.fillRect(14, 0, 1.5, 48); p.fillRect(0, 43, 48, 1); p.fillRect(43, 0, 1, 48);
  return c; }
const TILES = { red: tile('#8f1d1f', '#3a0b0d', '#1f4a2c', '#f0d9a0'), green: tile('#1f4d31', '#0c2416', '#8f1d1f', '#e8cf8a'), buff: tile('#a3231f', '#190606', '#190606', '#c8433a') };
function pat(g, name, sc) { const p = g.createPattern(TILES[name], 'repeat'); if (p.setTransform) p.setTransform(new DOMMatrix().scale(sc || .5)); return p; }

// =====================================================================================================
// state + storage
// =====================================================================================================
const STORE = 'squeegee.room.v1', NN = 8;
let nights = (() => { try { const a = JSON.parse(localStorage.getItem(STORE)); return Array.isArray(a) ? a.slice(0, NN) : []; } catch (e) { return []; } })();
function saveNights() { try { localStorage.setItem(STORE, JSON.stringify(nights)); return true; } catch (e) { toast("Couldn't save: storage is full"); return false; } }
let lastPhotoURL = null; try { lastPhotoURL = localStorage.getItem('squeegee.lastPhoto'); } catch (e) {}
const imgCache = {};
function imgFor(url) { let im = imgCache[url]; if (!im) { im = new Image(); im.src = url; imgCache[url] = im; } return im; }
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); } catch (e) { return ''; } };
let toastT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; on(el, true); clearTimeout(toastT); toastT = setTimeout(() => on(el, false), 2000); }
function msg(main, small) { const el = $('msg'); el.innerHTML = ''; if (!main) { on(el, false); return; } el.appendChild(document.createTextNode(main));
  if (small) { const sm = document.createElement('small'); sm.textContent = small; el.appendChild(sm); } on(el, true); }

let mode = 'deed';   // deed | cabin | wipe | stepin | room

// =====================================================================================================
// default "photo" (painted, no network) for anyone who doesn't pick one
// =====================================================================================================
function paintDefault(g, w, h, variant) {
  const sky = g.createLinearGradient(0, 0, 0, h * .62);
  if (variant % 2 === 0) { sky.addColorStop(0, '#2b3a8f'); sky.addColorStop(.45, '#c2589a'); sky.addColorStop(.8, '#ff9a5a'); sky.addColorStop(1, '#ffd27a'); }
  else { sky.addColorStop(0, '#0b1d4d'); sky.addColorStop(.5, '#1f6f8b'); sky.addColorStop(.85, '#8fe3c6'); sky.addColorStop(1, '#f6f3c2'); }
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  const sx = w * .62, sy = h * .5, sr = Math.min(w, h) * .11;
  const gl = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 5);
  gl.addColorStop(0, 'rgba(255,240,200,.95)'); gl.addColorStop(.18, 'rgba(255,210,140,.55)'); gl.addColorStop(1, 'rgba(255,180,120,0)');
  g.fillStyle = gl; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff6dc'; g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
  const rnd = mkRnd(7 + variant * 13);
  const ridge = (base, amp, col, seed) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w + 10; x += 6) g.lineTo(x, base - amp * (.5 + .5 * Math.sin(x * .011 + seed)) * (.6 + .4 * Math.sin(x * .027 + seed * 2)) - amp * .25 * Math.sin(x * .07 + seed));
    g.lineTo(w, h); g.closePath(); g.fill(); };
  ridge(h * .56, h * .16, variant % 2 ? '#2d4f73' : '#6b4a8f', 1.3); ridge(h * .6, h * .1, variant % 2 ? '#1d3654' : '#45306b', 4.1);
  const lake = g.createLinearGradient(0, h * .6, 0, h);
  lake.addColorStop(0, variant % 2 ? '#5fb6b0' : '#e48a7a'); lake.addColorStop(1, variant % 2 ? '#0b2238' : '#2a1d4a');
  g.fillStyle = lake; g.fillRect(0, h * .6, w, h * .4);
  g.fillStyle = 'rgba(255,240,200,.5)';
  for (let i = 0; i < 26; i++) { const y = h * .61 + i * i * .55 * (h / 800), ww = sr * (2.2 - i * .06) * (.6 + rnd() * .6); g.globalAlpha = .55 - i * .018; g.fillRect(sx - ww / 2 + (rnd() - .5) * 12, y, ww, 2.2); }
  g.globalAlpha = 1;
  const pine = (x, base, ht) => { g.fillStyle = '#120d24'; g.beginPath(); g.moveTo(x, base - ht);
    for (let k = 0; k < 4; k++) { const yy = base - ht + ht * (k + 1) / 4, ww = ht * .22 * (k + 1) / 2.2; g.lineTo(x + ww, yy); g.lineTo(x + ww * .35, yy); }
    g.lineTo(x + 3, base); g.lineTo(x - 3, base);
    for (let k = 3; k >= 0; k--) { const yy = base - ht + ht * (k + 1) / 4, ww = ht * .22 * (k + 1) / 2.2; g.lineTo(x - ww * .35, yy); g.lineTo(x - ww, yy); }
    g.closePath(); g.fill(); };
  for (let i = 0; i < 9; i++) pine(w * .02 + i * w * .045, h * .63, h * (.12 + rnd() * .1));
  for (let i = 0; i < 4; i++) pine(w * .82 + i * w * .05, h * .63, h * (.1 + rnd() * .08));
}
const defaultURLs = {};
function defaultURL(v) { if (!defaultURLs[v]) { const c = document.createElement('canvas'); c.width = 540; c.height = 640; paintDefault(c.getContext('2d'), 540, 640, v); defaultURLs[v] = c.toDataURL('image/jpeg', .85); } return defaultURLs[v]; }
let pendingURL = null;   // tonight's photo while the window is being cleared
function shrinkToURL(img) { const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, sc = Math.min(1, 720 / Math.max(iw, ih));
  const c = document.createElement('canvas'); c.width = Math.round(iw * sc); c.height = Math.round(ih * sc);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .82); }

// =====================================================================================================
// THE ROOM  (world units: 2000 x 1000, floor line at y=700)
// =====================================================================================================
const RW = 2000, RH = 1000;
const FRAMES = [   // outer rect, style, the night that fills it
  { x: 905, y: 182, w: 190, h: 218, st: 'gold' },    // 1 hero, above the mantel
  { x: 338, y: 150, w: 132, h: 158, st: 'wood' },    // 2 by the tree
  { x: 1470, y: 176, w: 176, h: 132, st: 'dark' },   // 3 over the sofa
  { x: 345, y: 330, w: 128, h: 106, st: 'white' },   // 4 by the lamp
  { x: 1318, y: 212, w: 130, h: 162, st: 'wood' },   // 5 over the sofa
  { x: 1478, y: 330, w: 124, h: 124, st: 'gold' },   // 6 over the sofa
  { x: 1800, y: 384, w: 88, h: 102, st: 'white' },   // 7 on the hutch
  { x: 1628, y: 300, w: 108, h: 140, st: 'dark' }    // 8 over the sofa
];
const INSET = { gold: 17, wood: 13, dark: 12, white: 15 };
const inner = f => { const b = INSET[f.st]; return { x: f.x + b, y: f.y + b, w: f.w - 2 * b, h: f.h - 2 * b }; };
// pools of light, by the night that switches them on (0 = the fire, always burning)
